name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile (tsc + esbuild bundles)
        run: npm run compile

      - name: "Typecheck the webview bundle (separate tsconfig: DOM lib, no Node)"
        run: npm run typecheck:webview

      - name: Typecheck + compile the integration suite (separate tsconfig/outDir)
        run: npm run compile:integration

      - name: Unit tests (vitest, src/core)
        run: npm test
        env:
          # The strict timing bounds flake on shared runners without a real regression
          PERF_TESTS: "0"

      - name: Install Playwright's Chromium (with OS deps)
        run: npx playwright install --with-deps chromium

      - name: Webview e2e tests (Playwright against the built webview bundle)
        run: npx playwright test --grep-invert "200k rows x 30 columns"
        env:
          CI: "1"
        # The 200k-row scale spec is a timing benchmark, too noisy to gate every push

      - name: Integration tests (real VS Code Extension Host, via xvfb)
        run: xvfb-run -a npm run test:integration

      - name: Package the extension (.vsix)
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer-vsix
          path: "*.vsix"
          if-no-files-found: error
