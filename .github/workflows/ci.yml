name: CI

# Runs on every push and pull request. Kept deliberately conventional
# (standard actions, no custom runner image) since none of this can be run
# locally before merging — see CONTRIBUTING.md for the equivalent local
# commands this mirrors.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile (tsc + esbuild bundles)
        run: npm run compile

      - name: "Typecheck the webview bundle (separate tsconfig: DOM lib, no Node)"
        run: npm run typecheck:webview

      - name: Typecheck + compile the integration suite (separate tsconfig/outDir)
        run: npm run compile:integration

      - name: Unit tests (vitest, src/core)
        run: npm test
        env:
          # Deliberately NOT set to 1 here: the handful of perf-sensitive
          # stress tests (src/test/stress/{performance,sort,parser}.stress.
          # test.ts) use a generous sanity bound by default and only the
          # tight "real regression" bound under PERF_TESTS=1 — a shared
          # GitHub-hosted runner is noisy enough that the tight bound alone
          # flakes without a real regression (observed directly while
          # building this workflow: a sort of 500k rows that normally
          # takes ~1s took over 25s under contention from a concurrent
          # heavy test run). The tests still run and print their actual
          # timings either way, so a real regression is still visible in
          # the log — see src/test/stress/perfEnv.ts.
          PERF_TESTS: "0"

      - name: Install Playwright's Chromium (with OS deps)
        run: npx playwright install --with-deps chromium

      - name: Webview e2e tests (Playwright against the built webview bundle)
        run: npx playwright test --grep-invert "200k rows x 30 columns"
        env:
          CI: "1"
        # The 200k-row scale spec (src/test/webview-e2e/stress/scale.spec.ts)
        # is excluded here by its test title, not skipped in the source —
        # it's owned by a different work stream and this workflow doesn't
        # touch that file. It has its own CI-doubled bounds and is meant to
        # be run and watched deliberately (e.g. before a release), not as
        # a pass/fail gate on every push where normal runner noise could
        # make it flaky. Run it directly with:
        #   npx playwright test src/test/webview-e2e/stress/scale.spec.ts

      - name: Integration tests (real VS Code Extension Host, via xvfb)
        run: xvfb-run -a npm run test:integration
        # @vscode/test-electron needs a display to launch the real Code.app
        # Electron window; xvfb-run provides a virtual one on a headless
        # Linux runner. runTest.ts downloads and caches a stable VS Code
        # build itself (see its resolveVscodeExecutablePath) when the
        # hard-coded local dev path it also checks doesn't exist, which is
        # always the case in CI.

      - name: Package the extension (.vsix)
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer-vsix
          path: "*.vsix"
          if-no-files-found: error
